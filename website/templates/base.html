<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>{% block title %}Python Calculator{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <div class="shell">
        <header class="top">
            <nav class="tabs" aria-label="Pages">
                <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
                <a href="{{ url_for('age_calculator') }}" {% if request.endpoint == 'age_calculator' %}aria-current="page"{% endif %}>Age</a>
                <a href="{{ url_for('calculator') }}" {% if request.endpoint == 'calculator' %}aria-current="page"{% endif %}>Scientific</a>
            </nav>
            <nav class="tabs" aria-label="Project">
                <a href="{{ url_for('changelog') }}" {% if request.endpoint == 'changelog' %}aria-current="page"{% endif %}>Changelog</a>
            </nav>
        </header>
 
        <main>
            {% block content %}{% endblock %}
        </main>
 
    </div>
</body>

</html>
